name: CI Docker Build & Test

on:
  push:
    branches: [ feature/docker-ci, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t lab6-image .

      - name: Save image to archive
        run: docker save lab6-image > lab6-image.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v3
        with:
          name: lab6-image
          path: lab6-image.tar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: lab6-image

      - name: Load Docker image
        run: docker load -i lab6-image.tar

      - name: Run tests in container
        run: docker run --rm lab6-image pytest

